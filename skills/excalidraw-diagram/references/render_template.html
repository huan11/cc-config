<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; }
    #root { display: inline-block; }
    #root svg { display: block; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    window.__moduleReady = true;

    function getFontSize(fontSize, fontFamily) {
      return fontSize + 'px';
    }

    function getFontFamily(fontFamily) {
      const base = fontFamily === 1 ? 'Virgil' : fontFamily === 2 ? 'Helvetica' : 'Cascadia';
      return base + ', "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif';
    }

    function applyStrokeStyle(el, node) {
      if (el.strokeStyle === 'dashed') node.setAttribute('stroke-dasharray', '8 6');
      else if (el.strokeStyle === 'dotted') node.setAttribute('stroke-dasharray', '2 4');
    }

    function renderToSvg(data) {
      const elements = data.elements || [];
      const appState = data.appState || {};
      const bg = appState.viewBackgroundColor || '#ffffff';

      // Compute bounding box
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const el of elements) {
        if (el.isDeleted) continue;
        let x1 = el.x, y1 = el.y, x2, y2;
        if (el.type === 'rectangle') {
          x2 = el.x + el.width;
          y2 = el.y + el.height;
        } else if (el.type === 'ellipse') {
          x2 = el.x + el.width;
          y2 = el.y + el.height;
        } else if (el.type === 'text') {
          x2 = el.x + (el.width || 100);
          y2 = el.y + (el.height || 20);
        } else if (el.type === 'line' || el.type === 'arrow') {
          x2 = el.x + el.width;
          y2 = el.y + el.height;
        } else {
          x2 = el.x + (el.width || 0);
          y2 = el.y + (el.height || 0);
        }
        minX = Math.min(minX, x1);
        minY = Math.min(minY, y1);
        maxX = Math.max(maxX, x2);
        maxY = Math.max(maxY, y2);
      }

      if (minX === Infinity) { minX = 0; minY = 0; maxX = 800; maxY = 600; }

      const padding = 20;
      const svgW = maxX - minX + padding * 2;
      const svgH = maxY - minY + padding * 2;
      const offsetX = -minX + padding;
      const offsetY = -minY + padding;

      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', svgW);
      svg.setAttribute('height', svgH);
      svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);
      svg.setAttribute('xmlns', ns);

      // Background rect
      const bgRect = document.createElementNS(ns, 'rect');
      bgRect.setAttribute('x', 0);
      bgRect.setAttribute('y', 0);
      bgRect.setAttribute('width', svgW);
      bgRect.setAttribute('height', svgH);
      bgRect.setAttribute('fill', bg);
      svg.appendChild(bgRect);

      // Sort by z-index (version acts as order)
      const sorted = [...elements].filter(e => !e.isDeleted).sort((a, b) => {
        const za = a.groupIds?.length || 0;
        const zb = b.groupIds?.length || 0;
        if (za !== zb) return za - zb;
        return 0;
      });

      for (const el of sorted) {
        const x = el.x + offsetX;
        const y = el.y + offsetY;
        const stroke = el.strokeColor || '#000';
        const fill = el.backgroundColor || 'transparent';
        const strokeW = el.strokeWidth || 1;

        if (el.type === 'rectangle' || el.type === 'frame') {
          const rect = document.createElementNS(ns, 'rect');
          rect.setAttribute('x', x);
          rect.setAttribute('y', y);
          rect.setAttribute('width', el.width);
          rect.setAttribute('height', el.height);
          rect.setAttribute('fill', fill === 'transparent' || !fill ? 'none' : fill);
          rect.setAttribute('stroke', stroke);
          rect.setAttribute('stroke-width', strokeW);
          const r = el.roundness?.type === 3 ? 8 : (el.type === 'frame' ? 10 : 0);
          if (r) rect.setAttribute('rx', r);
          applyStrokeStyle(el, rect);
          svg.appendChild(rect);
        } else if (el.type === 'ellipse') {
          const ellipse = document.createElementNS(ns, 'ellipse');
          ellipse.setAttribute('cx', x + el.width / 2);
          ellipse.setAttribute('cy', y + el.height / 2);
          ellipse.setAttribute('rx', el.width / 2);
          ellipse.setAttribute('ry', el.height / 2);
          ellipse.setAttribute('fill', fill === 'transparent' || !fill ? 'none' : fill);
          ellipse.setAttribute('stroke', stroke);
          ellipse.setAttribute('stroke-width', strokeW);
          applyStrokeStyle(el, ellipse);
          svg.appendChild(ellipse);
        } else if (el.type === 'diamond') {
          const cx = x + el.width / 2;
          const cy = y + el.height / 2;
          const poly = document.createElementNS(ns, 'polygon');
          poly.setAttribute('points', `${cx},${y} ${x + el.width},${cy} ${cx},${y + el.height} ${x},${cy}`);
          poly.setAttribute('fill', fill === 'transparent' || !fill ? 'none' : fill);
          poly.setAttribute('stroke', stroke);
          poly.setAttribute('stroke-width', strokeW);
          applyStrokeStyle(el, poly);
          svg.appendChild(poly);
        } else if (el.type === 'text') {
          const fontSize = el.fontSize || 16;
          const lineH = fontSize * (el.lineHeight || 1.25);
          const lines = (el.text || '').split('\n');
          const textBlockH = Math.max(lines.length, 1) * lineH;
          let baselineY = y + fontSize * 0.82;
          if (el.verticalAlign === 'middle' && el.height) {
            baselineY = y + (el.height - textBlockH) / 2 + fontSize * 0.82;
          } else if (el.verticalAlign === 'bottom' && el.height) {
            baselineY = y + el.height - textBlockH + fontSize * 0.82;
          }
          let anchorX = x;
          if (el.textAlign === 'center') anchorX = x + (el.width || 100) / 2;
          else if (el.textAlign === 'right') anchorX = x + (el.width || 100);
          const text = document.createElementNS(ns, 'text');
          text.setAttribute('x', anchorX);
          text.setAttribute('y', baselineY);
          text.setAttribute('fill', stroke);
          text.setAttribute('font-size', getFontSize(fontSize, el.fontFamily));
          text.setAttribute('font-family', getFontFamily(el.fontFamily));
          text.setAttribute('font-weight', fontSize >= 22 ? '600' : '400');
          text.setAttribute('text-anchor', el.textAlign === 'center' ? 'middle' : el.textAlign === 'right' ? 'end' : 'start');
          for (let i = 0; i < lines.length; i++) {
            const tspan = document.createElementNS(ns, 'tspan');
            tspan.setAttribute('x', anchorX);
            tspan.setAttribute('dy', i === 0 ? 0 : lineH);
            tspan.textContent = lines[i];
            text.appendChild(tspan);
          }
          svg.appendChild(text);
        } else if (el.type === 'line' || el.type === 'arrow') {
          const pts = el.points || [[0,0],[el.width,el.height]];
          const line = document.createElementNS(ns, 'polyline');
          const ptsStr = pts.map((p, i) => {
            const px = x + (el.points ? p[0] : (i === 0 ? 0 : el.width));
            const py = y + (el.points ? p[1] : (i === 0 ? 0 : el.height));
            return `${px},${py}`;
          }).join(' ');
          line.setAttribute('points', ptsStr);
          line.setAttribute('fill', 'none');
          line.setAttribute('stroke', stroke);
          line.setAttribute('stroke-width', strokeW);
          line.setAttribute('stroke-linejoin', 'round');
          line.setAttribute('stroke-linecap', 'round');
          applyStrokeStyle(el, line);
          if (el.type === 'arrow') {
            const markerId = 'arrowhead-' + (el.id || 'default').replace(/[^a-zA-Z0-9_-]/g, '');
            const defs = svg.querySelector('defs') || (function() {
              const d = document.createElementNS(ns, 'defs');
              svg.insertBefore(d, svg.firstChild.nextSibling);
              return d;
            })();
            if (!defs.querySelector('#' + markerId)) {
              const marker = document.createElementNS(ns, 'marker');
              marker.setAttribute('id', markerId);
              marker.setAttribute('markerWidth', '10');
              marker.setAttribute('markerHeight', '7');
              marker.setAttribute('refX', '9');
              marker.setAttribute('refY', '3.5');
              marker.setAttribute('orient', 'auto');
              const polygon = document.createElementNS(ns, 'polygon');
              polygon.setAttribute('points', '0 0, 10 3.5, 0 7');
              polygon.setAttribute('fill', stroke);
              marker.appendChild(polygon);
              defs.appendChild(marker);
            }
            line.setAttribute('marker-end', `url(#${markerId})`);
          }
          svg.appendChild(line);
        }
      }

      return svg;
    }

    window.renderDiagram = function(jsonData) {
      try {
        const data = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
        const svg = renderToSvg(data);
        const root = document.getElementById('root');
        root.innerHTML = '';
        root.appendChild(svg);
        window.__renderComplete = true;
        return { success: true, width: svg.getAttribute('width'), height: svg.getAttribute('height') };
      } catch (err) {
        window.__renderComplete = true;
        window.__renderError = err.message;
        return { success: false, error: err.message };
      }
    };
  </script>
</body>
</html>
